<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Login</title>

    <style>
        body {
            background: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
            padding: 20px; /* Mobile side spacing */
        }

        .box {
            background: #1e293b;
            padding: 40px 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 350px; /* Desktop var 350px peksha motha honar nahi */
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }

        h2 {
            margin-bottom: 25px;
            font-weight: 600;
            color: #22c55e; /* Green matching the button */
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            box-sizing: border-box; /* Padding mule box baher janar nahi */
            font-size: 16px; /* Mobile zoom issue yet nahi */
        }

        input:focus {
            outline: none;
            border-color: #22c55e;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #22c55e;
            border: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        button:hover {
            background: #16a34a;
            transform: translateY(-2px);
        }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            .box {
                padding: 30px 20px;
            }
            h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Team Login</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">LOGIN</button>
    </form>
</div>

</body>
</html>
