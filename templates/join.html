<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us | Auction Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background: #0f172a; color: white; font-family: 'Poppins', sans-serif; }
        .join-card {
            background: rgba(30, 41, 59, 0.6);
            border: 2px solid #fbbf24;
            padding: 40px;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.2);
        }
        .form-control {
            background: rgba(0,0,0,0.3) !important;
            border: 1px solid rgba(251, 191, 36, 0.4) !important;
            color: white !important;
            border-radius: 0;
            padding: 12px;
        }
        .form-control:focus { border-color: #fbbf24 !important; box-shadow: none; }
        .highlight { color: #fbbf24; font-family: 'Montserrat'; font-weight: 800; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 join-card">
                <h2 class="highlight text-center mb-4">START YOUR <span style="color: #fff;">LEAGUE</span></h2>
                <form class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small text-warning">Organiser Name</label>
                        <input type="text" class="form-control" placeholder="John Doe">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-warning">Contact Number</label>
                        <input type="text" class="form-control" placeholder="+91">
                    </div>
                    <div class="col-12">
                        <label class="form-label small text-warning">Tournament Name</label>
                        <input type="text" class="form-control" placeholder="Premier Cricket League">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-warning">Select Plan</label>
                        <select class="form-control">
                            <option>Starter (Upto 4 Teams)</option>
                            <option>Standard (Upto 6 Teams)</option>
                            <option>Major (6+ Teams)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-warning">Auction Date</label>
                        <input type="date" class="form-control">
                    </div>
                    <div class="col-12 mt-4 text-center">
                        <button type="submit" class="btn btn-warning w-100 fw-bold py-3 rounded-0">REQUEST DASHBOARD ACCESS</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
