<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Auction Live</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #004ba0;
            --accent-cyan: #00d4ff;
            --glass: rgba(0, 0, 0, 0.7);
        }

        body {
            background: #000;
            color: white;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #001529 0%, #000 100%);
            display: flex;
            flex-direction: column;
        }

        /* --- TOP SECTION (Fixed Height) --- */
        .top-container {
            display: flex;
            align-items: center;
            padding: 10px 50px;
            height: 15vh;
            background: linear-gradient(to bottom, var(--glass), transparent);
            flex-shrink: 0;
        }
        .logo-circle {
            width: 150px; height: 150px;
            border-radius: 50%;
            border: 3px solid var(--accent-cyan);
            background: #000;
            box-shadow: 0 0 20px var(--accent-cyan);
            object-fit: cover;
            margin-top: 60px;
            margin-left: 50px
        }
        .tournament-title {
            flex-grow: 1;
            text-align: center;
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 0 0 10px var(--accent-cyan);
        }

        /* --- MIDDLE SECTION (Dynamic Flex) --- */
        .middle-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-grow: 1;
            padding: 0 40px;
            height: 60vh;
            gap: 20px;
        }

        /* LEFT SIDE BOXES */
        .left-stats-panel {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-shrink: 0;
        }
        .stat-card {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid white;
            padding: 12px 15px;
            border-radius: 4px;
            border-left: 5px solid var(--accent-cyan);
        }
        .stat-label { 
            font-size: 0.7rem; color: #ffd700; text-transform: uppercase; 
            border-bottom: 1px solid #333; margin-bottom: 8px; font-weight: 700;
        }
        .stat-value { font-size: 1.1rem; font-weight: 900; color: white; text-transform: uppercase; }
        .stat-price { color: var(--accent-cyan); font-weight: 900; font-size: 1rem; }
        .stat-team { color: #aaa; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }

        /* CENTER: Player Image */
        .player-frame {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            margin-top: 150px; /* ऑक्टागोन थोडा खाली सरकवण्यासाठी */
        }
        .octagon {
            width: 320px; height: 320px;
            background: var(--accent-cyan);
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            padding: 3px;
        }
        .octagon-inner {
            width: 100%; height: 100%;
            background: #050505;
            clip-path: inherit;
            overflow: hidden;
        }
        .octagon-inner img { width: 100%; height: 100%; object-fit: contain; }

        /* --- TIMER & ROUND BOXES (Yellow Elements) --- */
        .timer-container {
            position: absolute;
            /* कोपऱ्यात नेण्यासाठी bottom आणि left वापरा */
            bottom: 70px;  /* खालून ४० पिक्सेल वर (गरजेनुसार बदलू शकतोस) */
            left: 70px;    /* डावीकडून ४० पिक्सेल उजवीकडे */
            z-index: 1000; /* इतर लेअर्सच्या वर दिसण्यासाठी */
            
            /* जर आधी transform: translateX(-50%) असेल तर ते काढून टाक */
            transform: none; 
        }

        .timer-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 1px solid #ffd700; /* Yellow */
            background: rgba(0, 0, 5, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffd700;
            box-shadow: 0 0 15px #ffd700;
            
        }
        
        
        .round-container {
            position: absolute;
            top: 24vh;
            right: 690px;
            z-index: 100;
        }

        .round-box {
            width: 130px;
            height: 40px;
            border: 0px solid #000000;
            background: rgba(2, 25, 26, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.0rem;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(19, 19, 19, 0.5);
        }
        /* टीमचे नाव ठळक पिवळ्या रंगात */
        .team-highlight {
            color: #ffd700; /* Yellow */
            font-size: 1.0rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        /* हायफन (-) आणि प्राईस */
        .hyphen, .price-highlight {
            color: #ffd700;
            font-size: 1.0rem;
            font-weight: 900;
        }
                /* RIGHT: Sidebar */
        .team-sidebar {
            width: 280px; /* थोडी विड्थ वाढवली प्रॉपर अलाइनमेंटसाठी */
            background: var(--glass);
            border: 1px solid var(--accent-cyan);
            border-radius: 15px;
            padding: 15px;
            height: 300px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }
        .sidebar-header {
            color: #ffd700 !important; font-size: 0.75rem; letter-spacing: 1px;
            background: rgba(0,0,0,0.8); padding-bottom: 5px;
            border-bottom: 2px solid var(--accent-cyan); z-index: 10; margin-bottom: 5px;
        }

        .scroll-container { flex-grow: 1; overflow: hidden; position: relative; }
        .scroll-box { animation: slideTeamsSteps 16s cubic-bezier(1, 0, 0, 1) infinite;}
        @keyframes slideTeamsSteps {
                /* समजा तुझ्याकडे १२ टीम्स आहेत आणि आपण ४-४ दाखवतोय, तर ३ स्टेप्स होतील */
                0%, 25% { transform: translateY(0); }             /* पहिल्या ४ टीम्स थांबतील */
                30%, 55% { transform: translateY(-33.33%); }      /* पुढच्या ४ टीम्स */
                60%, 85% { transform: translateY(-66.66%); }      /* शेवटच्या ४ टीम्स */
                90%, 100% { transform: translateY(0); }           /* परत पहिल्यापासून */
            }
        
        .t-row { 
            display: flex; flex-direction: row; justify-content: space-between; 
            padding: 10px 0; border-bottom: 1px solid #333; 
            font-size: 0.85rem; color: white; height:50px; align-items: center;
        }

        .team-name-cell { width: 50%; font-weight: 900; text-align: left; }
        .team-stats-cell { width: 20%; text-align: center; }
        .team-points-cell { width: 30%; text-align: right; color: #ffd700; font-weight: 900; }

        
        /* --- BOTTOM BAR (Fixed Bottom) --- */
        .bottom-auction-bar {
            height: 18vh; /* थोडी हाईट कमी केली टिकरसाठी */
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 10px;
            padding-bottom: 10px;
            flex-shrink: 0;
        }
        .trap-box {
            background: rgba(0, 20, 40, 0.9);
            border: 2px solid var(--accent-cyan);
            padding: 10px 20px;
            text-align: center;
            min-width: 300px;
            box-shadow: inset 0 0 15px var(--accent-cyan);
        }
        .trap-left { clip-path: polygon(8% 0%, 100% 0%, 100% 100%, 0% 100%); }
        .trap-center { clip-path: polygon(5% 0%, 95% 0%, 100% 100%, 0% 100%); border-top: 4px solid var(--accent-cyan); }
        .trap-right { clip-path: polygon(0% 0%, 92% 0%, 100% 100%, 0% 100%); }

        .label { color: #aaa; font-size: 0.8rem; text-transform: uppercase; font-weight: 700; }
        .value { font-size: 2.2rem; font-weight: 900; }
        .p-name { font-size: 1.8rem; color: var(--accent-cyan); text-transform: uppercase; font-weight: 900; }

        /* --- TICKER CSS --- */
        .news-ticker {
            height: 35px;
            background: #ffd700;
            color: #000;
            overflow: hidden;
            white-space: nowrap;
            display: flex;
            align-items: center;
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            width: 100%;
        }
        .ticker-text {
            display: inline-block;
            padding-left: 100%;
            animation: tickerScroll 100s linear infinite;
        }
        @keyframes tickerScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* Overlays */
        #sold-overlay, #unsold-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999; align-items: center; justify-content: center;
        }
    </style>
</head>
<body onload="updateDisplay()">

    <div id="sold-overlay">
        <div style="border: 5px solid white; padding: 60px; border-radius: 40px; background: linear-gradient(135deg, #000, var(--primary-blue)); text-align: center;">
            <h1 style="font-size: 8rem; margin: 0;">🔨 SOLD</h1>
            <h2 id="sold-team-name" style="font-size: 3.5rem; color: white;"></h2>
            <h3 id="sold-price" style="font-size: 5rem; color: #ffd700;"></h3>
        </div>
    </div>

    <div id="unsold-overlay">
        <div style="border: 5px solid #ff4b2b; padding: 60px; border-radius: 40px; background: linear-gradient(135deg, #000, #ff416c); text-align: center;">
            <h1 style="font-size: 8rem; margin: 0; color: white;">🚫 UNSOLD</h1>
            <h2 id="unsold-p-name" style="font-size: 3.5rem; color: white; text-transform: uppercase;"></h2>
        </div>
    </div>

    <div class="top-container">
        <img id="t-logo" class="logo-circle" src="" alt="Logo">
        <div id="t-name" class="tournament-title">Loading...</div>
    </div>
   

        <div class="round-container">
            <div id="auction-round" class="round-box">Round -</div>
    </div>

    <div class="middle-content">
        <div class="left-stats-panel">
            <div class="stat-card">
                <div class="stat-label" style="text-align: center;">Most Expensive</div>
                <div id="top-p-name" class="stat-value text-truncate" style="font-size: 1.6rem; margin-bottom: 5px;">---</div>
                <div class="d-flex justify-content-between mt-1">
                    <span id="top-p-team" class="team-highlight">---</span>
                    <span class="hyphen">-</span>
                    <span id="top-p-price" class="price-highlight">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label" style="text-align: center;">Last Sold</div>
                <div id="last-p-name" class="stat-value text-truncate" style="font-size: 1.6rem; margin-bottom: 5px;">---</div>
                <div class="d-flex justify-content-between mt-1">
                    
                    <span id="last-p-team" class="team-highlight">---</span>
                    <span class="hyphen">-</span>
                    <span id="last-p-price" class="price-highlight">0</span>

                </div>
            </div>
        </div>

        <div class="player-frame">
            <div class="octagon">
                <div class="octagon-inner">
                    <img id="p-img" src="" alt="Player">
                </div>
            </div>
            <div id="p-role" class="mt-2 bg-primary px-3 py-1 rounded-pill small fw-bold">-</div>
        </div>

        <div class="team-sidebar">
            <div class="d-flex justify-content-between sidebar-header">
                <span style="width:50%">TEAM</span>
                <span style="width:20%; text-align:center">PL</span>
                <span style="width:30%; text-align:right">REM PT</span>
            </div>
            <div class="scroll-container">
                <div id="team-list-container" class="scroll-box"></div>
            </div>
        </div>
    </div>

    <div class="bottom-auction-bar">
        <div class="trap-box trap-left">
            <div class="label">Base Price</div>
            <div id="p-base" class="value">₹ 0</div>
        </div>
        <div class="trap-box trap-center">
            <div id="p-name" class="p-name">-</div>
        </div>
        <div class="trap-box trap-right">
            <div class="label">Current price</div>
            <div id="p-current" class="value" style="color: #ffd700;">₹ 0</div>
            <div id="p-bidder" style="font-size: 0.8rem; color: var(--accent-cyan); font-weight: bold;">BY: NO BID</div>
        </div>
    </div>

    <div class="news-ticker">
        <div id="ticker-data" class="ticker-text">AUCTION IN PROGRESS... LOADING RECENT SALES...</div>
    </div>

    <script>
        
    let lastStatus = "";
    
    async function updateDisplay() {
        try {
            const response = await fetch(`/display_data/{{ t_id }}`);
            const data = await response.json();
            
            // --- Basic Info Sync ---
            document.getElementById('t-name').innerText = data.tournament_name;
            document.getElementById('t-logo').src = "/static/uploads/logos/" + (data.tournament_logo || 'default.png');
            
            // --- NEW: Timer & Round Sync (Yellow Boxes) ---
            
            document.getElementById('auction-round').innerText = "Round-  " + (data.player.round || "1");

            // --- Player Details ---
            document.getElementById('p-name').innerText = data.player.name;
            document.getElementById('p-img').src = "/static/uploads/players/" + (data.player.image || 'default.jpg');
            document.getElementById('p-role').innerText = data.player.role;
            document.getElementById('p-base').innerText = "₹ " + data.player.base_price;
            document.getElementById('p-current').innerText = "₹ " + (data.player.current_price || data.player.base_price);
            document.getElementById('p-bidder').innerText = "BY: " + data.bidder_name;

            // --- Stats Panel ---
            document.getElementById('top-p-name').innerText = data.top_player.name !== "None" ? data.top_player.name : "---";
            document.getElementById('top-p-price').innerText = data.top_player.price;
            document.getElementById('top-p-team').innerText = data.top_player.team;

            document.getElementById('last-p-name').innerText = data.last_sold.name !== "None" ? data.last_sold.name : "---";
            document.getElementById('last-p-price').innerText = data.last_sold.price;
            document.getElementById('last-p-team').innerText = data.last_sold.team;

            // --- Ticker Logic ---
            if(data.ticker_data) {
                document.getElementById('ticker-data').innerText = data.ticker_data;
            }

            // --- Overlay Logic (Sold/Unsold) ---
            if (data.player.status !== lastStatus) {
                if (data.player.status === 'sold') {
                    document.getElementById('sold-team-name').innerText = data.bidder_name;
                    document.getElementById('sold-price').innerText = "₹ " + data.player.current_price;
                    document.getElementById('sold-overlay').style.display = 'flex';
                    setTimeout(() => { document.getElementById('sold-overlay').style.display = 'none'; }, 5000);
                } else if (data.player.status === 'unsold') {
                    document.getElementById('unsold-p-name').innerText = data.player.name;
                    document.getElementById('unsold-overlay').style.display = 'flex';
                    setTimeout(() => { document.getElementById('unsold-overlay').style.display = 'none'; }, 5000);
                }
            }
            lastStatus = data.player.status;

            // --- Team Sidebar Sync ---
            let teamHtml = "";
            data.teams.forEach(t => {
                teamHtml += `<div class="t-row">
                    <span class="team-name-cell">${t.name}</span> 
                    <span class="team-stats-cell">${t.players_count}</span>
                    <span class="team-points-cell">${t.remaining_points}</span>
                </div>`;
            });
            document.getElementById('team-list-container').innerHTML = teamHtml;

        } catch (e) { 
            console.log("Error fetching data:", e); 
        }

        // २ सेकंदाने रिफ्रेश होत राईल
        setTimeout(updateDisplay, 2000);
    }
</script>
</body>
</html>
