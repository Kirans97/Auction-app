<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ team.name }} | Squad Sheet</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
    * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    :root {
        --team-primary: {{ team.theme_color or '#0284c7' }};
        --bg-black: #000000;
        --card-dark: #111111;
    }

    body {
        background: var(--bg-black);
        font-family: 'Poppins', sans-serif;
        margin: 0;
        padding: 10px;
        color: white;
    }

    /* --- फक्त प्रिंट बटन ठेवले आहे --- */
    .no-print-header {
        max-width: 250mm;
        margin: 0 auto 20px auto;
        display: flex;
        justify-content: flex-end; /* उजवीकडे ढकलले */
        align-items: center;
    }

    .btn-custom-print {
        background: white;
        color: black !important;
        font-weight: 800;
        border-radius: 5px;
        padding: 8px 15px;
        border: none;
        font-size: 0.8rem;
    }

    .squad-container {
        width: 250mm;
        margin: auto;
        padding: 7mm;
        background: var(--bg-black);
        border: 4px solid var(--team-primary);
        border-radius: 15px;
    }

    /* तुझी मूळ हेडर्स डिझाईन - जशीच्या तशी */
    .team-header-new {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(135deg, #000000 0%, var(--team-primary) 100%);
        padding: 10px 30px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.1);
        margin-bottom: 25px;
        height: 115px;
    }

    /* तुझा मूळ लोगो बॉक्स - काहीही बदल नाही */
    .logo-box {
        width: 90px;
        height: 90px;
        background: #FFFFFF !important; 
        border-radius: 50% !important;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        border: 3px solid var(--team-primary);
        overflow: hidden !important;
        box-shadow: 0 0 15px rgba(255,255,255,0.2);
        padding: 0;
    }

    .logo-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .header-text-box { flex-grow: 1; text-align: center; }

    .team-name {
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-size: 2.2rem;
        color: white !important;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 0;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .team-sub {
        color: rgba(255,255,255,0.9);
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 2px;
    }

    .squad-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 15px;
    }

    /* मोबाईलसाठी फक्त ग्रीड ॲडजस्ट केली (प्रिंटवर परिणाम होणार नाही) */
    @media (max-width: 768px) {
        .squad-container { width: 100%; padding: 10px; }
        .squad-grid { grid-template-columns: repeat(3, 1fr); }
        .team-name { font-size: 1.5rem; }
    }
    @media (max-width: 480px) {
        .squad-grid { grid-template-columns: repeat(2, 1fr); }
        .team-header-new { padding: 10px; height: auto; }
        .logo-box { width: 60px; height: 60px; }
    }

    .player-card {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .player-round-frame {
        width: 110px;
        height: 110px;
        border-radius: 50% !important;
        border: 3px solid var(--team-primary);
        background: var(--card-dark);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden !important;
        margin-bottom: 10px;
    }

    .player-round-frame img {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
    }

    .player-name-tag {
        background: var(--team-primary);
        color: #000000 !important;
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        padding: 5px;
        width: 100%;
        border-radius: 8px;
        text-align: center;
        font-size: 0.8rem;
        min-height: 35px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-transform: uppercase;
    }

    .empty-card .player-round-frame {
        border: 2px dashed #334155;
    }

    .empty-text { color: #334155; font-size: 1.5rem; }

    .vacant-tag {
        background: #1e293b !important;
        color: #64748b !important;
    }

    @media print {
        body { background: black !important; padding: 0; }
        .no-print { display: none !important; }
        .squad-container { border: 4px solid var(--team-primary) !important; width: 250mm; margin: auto; }
        .squad-grid { grid-template-columns: repeat(5, 1fr) !important; }
    }
</style>
</head>
<body>

<div class="no-print-header no-print">
    <button onclick="window.print()" class="btn-custom-print">
        <i class="fas fa-print me-1"></i> PRINT SQUAD
    </button>
</div>

<div class="squad-container">
    <div class="team-header-new">
        <div class="logo-box">
            <img src="{{ url_for('static', filename='uploads/logos/' + (tournament.logo if tournament.logo else 'default.png')) }}" alt="Tournament Logo">
        </div>

        <div class="header-text-box">
            <div class="team-name">{{ team.name }}</div>
            <div class="team-sub">OFFICIAL SQUAD LIST</div>
        </div>

        <div class="logo-box">
            <img src="{{ url_for('static', filename='uploads/logos/' + (team.logo or 'default.png')) }}" alt="Team">
        </div>
    </div>

    <div class="squad-grid">
        {% for p in players %}
        <div class="player-card">
            <div class="player-round-frame">
                {% if p.image %}
                    <img src="{{ url_for('static', filename='uploads/players/' + p.image) }}" alt="{{ p.name }}">
                {% else %}
                    <span style="color:#475569;font-size:0.6rem;">NO PHOTO</span>
                {% endif %}
            </div>
            <div class="player-name-tag">
                {{ p.name }}
            </div>
        </div>
        {% endfor %}

        {% for i in range(15 - players|length) %}
        <div class="player-card empty-card">
            <div class="player-round-frame">
                <span class="empty-text">+</span>
            </div>
            <div class="player-name-tag vacant-tag">
                VACANT
            </div>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
