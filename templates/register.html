<!DOCTYPE html>
<html>
<head>
    <title>Registration - {{ tournament.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="bg-dark text-white">
<div class="container py-4">
    <div class="card bg-secondary text-white mx-auto shadow" style="max-width: 650px;">
        <div class="card-header bg-primary text-center py-3">
            <h4>{{ tournament.name }} Registration</h4>
        </div>
        <form action="" method="POST" enctype="multipart/form-data" class="card-body">
            
            <h6 class="text-warning border-bottom pb-2">👤 PERSONAL & CONTACT</h6>
            <div class="mb-3">
                <label>Player Full Name *</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                 <label>Upload Your Photo (Auction sathi) *</label>
                <input type="file" name="photo" class="form-control" accept="image/*" required>
            </div>
            <div class="mb-3">
                <label>Address</label>
                <input type="text" name="address" class="form-control">
            </div>
            <div class="mb-3">
                <label>Contact Number *</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark text-white">+91</span>
                    <input type="text" name="contact" class="form-control" placeholder="10 Digits" pattern="\d{10}" required>
                </div>
            </div>

            <h6 class="text-warning border-bottom pb-2 mt-4">🏏 CRICKET DETAILS</h6>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label>Category</label>
                    <select name="role" class="form-select" required>
                        <option value="Batter">Batter</option>
                        <option value="Bowler">Bowler</option>
                        <option value="All-Rounder">All-Rounder</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label>Batting Style</label>
                    <select name="bat_style" class="form-select">
                        <option value="Right Handed">Right Handed</option>
                        <option value="Left Handed">Left Handed</option>
                        <option value="NA">NA</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label>Bowling Style</label>
                    <select name="bowl_style" class="form-select">
                        <option value="Right Handed">Right Handed</option>
                        <option value="Left Handed">Left Handed</option>
                        <option value="NA">NA</option>
                    </select>
                </div>
            </div>

            <div class="text-center bg-dark py-1 my-3 fw-bold">T-SHIRT DETAILS</div>
            <div class="row">
                <div class="col-6 mb-3">
                    <label>Name on T-shirt</label>
                    <input type="text" name="ts_name" class="form-control">
                </div>
                <div class="col-6 mb-3">
                    <label>Choice No.</label>
                    <input type="number" name="ts_no" class="form-control">
                </div>
                <div class="col-12 mb-3">
                    <label>Size (38, 40, 42, 44...)</label>
                    <input type="text" name="ts_size" class="form-control" placeholder="Enter size manually">
                </div>
            </div>

            <h6 class="text-warning border-bottom pb-2 mt-4">💰 PAYMENT DETAILS</h6>
            <div class="alert alert-dark text-center py-2">
                <p class="mb-1">Registration Fee: ₹{{ tournament.registration_fee or 'Fixed' }}</p>
                <p class="mb-0 small text-info">UPI ID: tournament@upi</p>
            </div>
            <div class="mb-3">
                <label>Transaction ID / UTR *</label>
                <input type="text" name="tx_id" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Upload Payment Screenshot *</label>
                <input type="file" name="payment_ss" class="form-control" accept="image/*" required>
            </div>

            <button type="submit" class="btn btn-warning w-100 py-2 mt-3 fw-bold">SUBMIT REGISTRATION</button>
        </form>
    </div>
</div>
</body>
</html>
