{% extends "layout.html" %}
{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    
    <div class="card p-4 shadow-lg bg-dark text-white" style="width: 100%; max-width: 400px; border-radius: 15px;">
        
        <div class="text-center mb-4">
            <h4 class="text-white">Login</h4>
            <small class="text-secondary">{{t.name}}</small>
        </div>

        <form method="post">
            <div class="mb-3">
                <label class="form-label text-light">Username</label>
                <input class="form-control" name="username" placeholder="Enter username" required>
            </div>

            <div class="mb-4">
                <label class="form-label text-light">Password</label>
                <input class="form-control" name="password" type="password" placeholder="Enter password" required>
            </div>

            <button class="btn btn-success w-100 fw-bold py-2" style="border-radius: 8px;">
                Login
            </button>
        </form>

    </div>
</div>

{% endblock %}
