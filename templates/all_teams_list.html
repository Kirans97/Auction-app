<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Teams | Auction System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a; 
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 60px; /* बटणसाठी जागा */
        }

        .container {
            max-width: 1000px;
            padding: 0px 20px 40px 20px; /* वरची पॅडिंग '0' करा */
            margin-top: 10px;
        }

        .header-title {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #fbbf24;
            text-shadow: 0px 4px 10px rgba(0,0,0,0.5);
        }

        /* --- BACK TO DASHBOARD BUTTON FIXED --- */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #fbbf24;
            color: #000 !important;
            padding: 8px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(251, 191, 36, 0.2);
            z-index: 100;
        }

        .back-btn:hover {
            transform: translateX(-5px);
            background: #f59e0b;
        }

        /* --- PRINT BUTTON --- */
        .print-all-btn {
            display: inline-block;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #000;
            padding: 10px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 40px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
        }

        /* --- ORIGINAL CARD DESIGN (NO CHANGE) --- */
        .team-card {
            background: rgba(30, 41, 59, 0.7);
            border: 2px solid #334155;
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            display: block;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .team-card:hover {
            transform: translateY(-10px);
            border-color: #fbbf24;
            background: #1e293b;
            box-shadow: 0px 10px 25px rgba(251, 191, 36, 0.2);
        }

        .team-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 10px;
        }

        .view-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 1px;
        }

        .card-decorator {
            position: absolute;
            bottom: -20px;
            right: -20px;
            width: 80px;
            height: 80px;
            background: rgba(251, 191, 36, 0.1);
            border-radius: 50%;
        }

        /* Responsive Fix for Mobile */
        @media (max-width: 576px) {
            body { align-items: flex-start; }
            .back-btn { top: 10px; left: 10px; padding: 5px 10px; font-size: 0.7rem; }
            .container { padding-top: 40px; }
            .col-6 { width: 50%; } /* मोबाईलवर एका ओळीत २ कार्ड्स */
        }
    </style>
</head>
<body>

    <a href="/dashboard/{{ t_id }}" class="back-btn">
        <i class="fas fa-arrow-left me-1"></i> Dashboard
    </a>

    <div class="container text-center">
        <h1 class="header-title">Select Team Squad</h1>
        
        <a href="/print-all-squads/{{ t_id }}" class="print-all-btn">
            <i class="fas fa-print me-1"></i> Print All Squads (PDF)
        </a>
        
        <div class="row g-4 justify-content-center">
            {% for team in teams %}
            <div class="col-lg-4 col-md-4 col-sm-6 col-6">
                <a href="/squad/{{ team.id }}" class="team-card">
                    <div class="view-label">Team Squad</div>
                    <div class="team-name">{{ team.name }}</div>
                    <div class="view-label mt-2" style="color:#fbbf24;">View Players →</div>
                    <div class="card-decorator"></div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
