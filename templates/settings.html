<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction Settings | Mobile Ready</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a; 
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        /* --- UI/UX Optimized Back Button --- */
        .back-btn { 
            display: inline-flex;
            align-items: center;
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24 !important;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid #fbbf24;
            margin-bottom: 25px;
            transition: 0.3s ease;
        }
        .back-btn:hover { background: #fbbf24; color: #000 !important; }

        /* --- Responsive Card --- */
        .settings-card { 
            background: #1e293b; 
            padding: 30px; 
            border-radius: 16px; 
            border: 1px solid #334155;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .header-section {
            border-bottom: 1px solid #334155;
            margin-bottom: 25px;
            padding-bottom: 15px;
        }

        .form-label { 
            font-weight: 700; 
            color: #fbbf24; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        .input-group-text { 
            background: #0f172a; 
            border: 1px solid #fbbf24; 
            color: #fbbf24;
            font-weight: bold;
        }

        .form-control-neon { 
            background: #ffffff !important; 
            border: 1px solid #fbbf24 !important; 
            color: #000 !important; 
            font-weight: 700;
            font-size: 1.1rem;
            border-radius: 0 8px 8px 0 !important;
        }

        .help-text { font-size: 0.7rem; color: #94a3b8; margin-top: 5px; }

        /* --- Save Button Mobile Optimized --- */
        .btn-save {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #000;
            font-weight: 800;
            padding: 16px;
            border: none;
            border-radius: 12px;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(251, 191, 36, 0.4); }

        /* --- Mobile Specific Fixes --- */
        @media (max-width: 576px) {
            .settings-card { padding: 20px; }
            .header-section h3 { font-size: 1.2rem; }
            .form-control-neon { padding: 10px; font-size: 1rem; }
            .row > div { margin-bottom: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <a href="/dashboard/{{ t_id }}" class="back-btn">
        <i class="fas fa-arrow-left me-2"></i> BACK TO DASHBOARD
    </a>

    <div class="settings-card">
        <div class="header-section d-flex justify-content-between align-items-center">
            <h3 class="mb-0 text-white">Auction Slabs</h3>
            <i class="fas fa-cog text-warning fa-lg"></i>
        </div>

        {% if request.args.get('success') %}
        <div class="alert alert-success py-2 border-0 mb-4" style="background: #10b981; color: white;">
            <i class="fas fa-check-circle me-2"></i> Settings Saved!
        </div>
        {% endif %}

        <form method="POST">
            <div class="row g-3">
                <div class="col-6 col-md-6">
                    <label class="form-label">Slab 1 (Limit)</label>
                    <div class="input-group">
                        <span class="input-group-text">₹</span>
                        <input type="number" name="limit1" class="form-control form-control-neon" value="{{ settings.limit1 }}" required>
                    </div>
                </div>
                <div class="col-6 col-md-6">
                    <label class="form-label">Increase By</label>
                    <div class="input-group">
                        <span class="input-group-text">+</span>
                        <input type="number" name="val1" class="form-control form-control-neon" value="{{ settings.val1 }}" required>
                    </div>
                </div>

                <div class="col-6 col-md-6">
                    <label class="form-label">Slab 2 (Limit)</label>
                    <div class="input-group">
                        <span class="input-group-text">₹</span>
                        <input type="number" name="limit2" class="form-control form-control-neon" value="{{ settings.limit2 }}" required>
                    </div>
                </div>
                <div class="col-6 col-md-6">
                    <label class="form-label">Increase By</label>
                    <div class="input-group">
                        <span class="input-group-text">+</span>
                        <input type="number" name="val2" class="form-control form-control-neon" value="{{ settings.val2 }}" required>
                    </div>
                </div>

                <div class="col-6 col-md-6">
                    <label class="form-label">Slab 3 (Limit)</label>
                    <div class="input-group">
                        <span class="input-group-text">₹</span>
                        <input type="number" name="limit3" class="form-control form-control-neon" value="{{ settings.limit3 }}" required>
                    </div>
                </div>
                <div class="col-6 col-md-6">
                    <label class="form-label">Increase By</label>
                    <div class="input-group">
                        <span class="input-group-text">+</span>
                        <input type="number" name="val3" class="form-control form-control-neon" value="{{ settings.val3 }}" required>
                    </div>
                </div>

                <div class="col-6 col-md-6">
                    <label class="form-label">Slab 4 (Base)</label>
                    <div class="input-group">
                        <span class="input-group-text">₹</span>
                        <input type="number" name="limit4" class="form-control form-control-neon" value="{{ settings.limit4 }}" required>
                    </div>
                </div>
                <div class="col-6 col-md-6">
                    <label class="form-label">Increase By</label>
                    <div class="input-group">
                        <span class="input-group-text">+</span>
                        <input type="number" name="val4" class="form-control form-control-neon" value="{{ settings.val4 }}" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-save">
                <i class="fas fa-save me-2"></i> Update Configuration
            </button>
        </form>
    </div>
</div>

</body>
</html>
